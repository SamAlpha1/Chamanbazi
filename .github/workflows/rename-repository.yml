name: Repository Maintenance

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rename-repository.yml"

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename repository safely
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_NAME: Activity-Archive
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GH_TOKEN is not available"
            exit 1
          fi

          CURRENT_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "$CURRENT_NAME" = "$TARGET_NAME" ]; then
            echo "Repository already has target name"
            exit 0
          fi

          HTTP_CODE=$(curl -sS -o /tmp/rename-response.json -w "%{http_code}" \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
            -d "{\"name\":\"${TARGET_NAME}\"}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Rename request failed with HTTP ${HTTP_CODE}"
            cat /tmp/rename-response.json
            exit 1
          fi

          echo "Repository renamed to ${TARGET_NAME}"
