<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BASE Creators Allocation</title>

    <style>
/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   VARIABLES
========================= */

:root {

    --base-blue: #0052ff;
    --base-light: #78a1ff;

    --green: #22c55e;

    --background: #030508;

    --text: #ffffff;

    --muted: #7c8492;
}


/* =========================
   BODY
========================= */

body {

    min-height: 100vh;

    padding:
        42px 18px 30px;

    display: flex;

    justify-content: center;

    color: var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(0, 82, 255, 0.28),
            transparent 40%
        ),

        radial-gradient(
            circle at 100% 70%,
            rgba(0, 82, 255, 0.10),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #05070b,
            #030508
        );
}


/* =========================
   CONTAINER
========================= */

.container {

    width: 100%;

    max-width: 540px;
}


/* =========================
   HEADER
========================= */

.header {

    text-align: center;

    margin-bottom: 30px;
}


/* =========================
   LOGO
========================= */

.logo {

    display: flex;

    align-items: center;

    justify-content: center;

    margin:
        0 auto 20px;
}


.logo img {

    width: 85px;

    height: auto;

    display: block;

    object-fit: contain;
}


/* =========================
   TITLE
========================= */

.header h1 {

    font-size: 30px;

    line-height: 1.15;

    font-weight: 850;

    letter-spacing: -1.3px;
}


.header p {

    margin-top: 10px;

    color: var(--muted);

    font-size: 14px;

    font-weight: 500;
}


/* =========================
   SEARCH SECTION
========================= */

.search-section {

    width: 100%;

    margin-bottom: 22px;
}


/* =========================
   USERNAME BOX
========================= */

.search-box {

    width: 100%;

    padding: 7px;

    background:
        rgba(14, 18, 27, 0.94);

    border:
        1px solid
        rgba(255, 255, 255, 0.09);

    border-radius: 16px;

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.30);

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}


.search-box:focus-within {

    border-color:
        rgba(0, 82, 255, 0.70);

    box-shadow:

        0 0 0 3px
        rgba(0, 82, 255, 0.10),

        0 15px 40px
        rgba(0, 0, 0, 0.30);
}


/* =========================
   INPUT
========================= */

.search-box input {

    width: 100%;

    height: 50px;

    padding:
        0 15px;

    border: none;

    outline: none;

    background: transparent;

    color: #ffffff;

    font-size: 15px;

    font-weight: 500;
}


.search-box input::placeholder {

    color: #5c6471;
}


/* =========================
   SEARCH BUTTON
========================= */

.search-btn {

    width: 100%;

    height: 50px;

    margin-top: 24px;

    border: none;

    border-radius: 13px;

    background:

        linear-gradient(
            135deg,
            #1462ff,
            #0045dc
        );

    color: #ffffff;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;

    box-shadow:

        0 8px 25px
        rgba(0, 82, 255, 0.28);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.search-btn:hover {

    transform:
        translateY(-1px);

    box-shadow:

        0 12px 30px
        rgba(0, 82, 255, 0.40);
}


.search-btn:active {

    transform:
        scale(0.98);
}


/* =========================
   ERROR
========================= */

.error {

    display: none;

    margin-top: 12px;

    padding: 12px;

    border-radius: 12px;

    text-align: center;

    color: #ff737b;

    background:
        rgba(255, 55, 65, 0.07);

    border:
        1px solid
        rgba(255, 55, 65, 0.18);

    font-size: 13px;
}


/* =========================
   RESULT CARD
========================= */

.result-card {

    display: none;

    position: relative;

    overflow: hidden;

    padding:
        38px 26px 28px;

    border-radius: 28px;

    background:

        linear-gradient(
            145deg,
            rgba(18, 26, 43, 0.96),
            rgba(6, 9, 15, 0.98)
        );

    border:
        1px solid
        rgba(255, 255, 255, 0.10);

    box-shadow:

        0 30px 90px
        rgba(0, 0, 0, 0.58),

        0 0 70px
        rgba(0, 82, 255, 0.08);

    animation:
        resultIn 0.45s ease;
}


/* =========================
   CARD GLOW
========================= */

.result-card::before {

    content: "";

    position: absolute;

    width: 330px;

    height: 330px;

    top: -220px;

    left: 50%;

    transform:
        translateX(-50%);

    background:
        var(--base-blue);

    filter:
        blur(120px);

    opacity: 0.18;

    pointer-events: none;
}


/* =========================
   RESULT CONTENT
========================= */

.result-content {

    position: relative;

    z-index: 2;

    text-align: center;
}


/* =========================
   PROFILE RING
========================= */

.profile-ring {

    width: 112px;

    height: 112px;

    padding: 4px;

    margin: 0 auto;

    border-radius: 50%;

    background:

        linear-gradient(
            145deg,
            #0052ff,
            #78a1ff
        );

    box-shadow:

        0 0 0 6px
        rgba(0, 82, 255, 0.07),

        0 0 40px
        rgba(0, 82, 255, 0.30);
}


/* =========================
   PROFILE IMAGE
========================= */

.profile-img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 50%;

    background: #101620;
}


/* =========================
   USERNAME
========================= */

.username {

    margin-top: 17px;

    font-size: 23px;

    font-weight: 850;

    letter-spacing: -0.7px;
}


.creator-name {

    margin-top: 5px;

    color: #7f8794;

    font-size: 13px;

    font-weight: 500;
}


/* =========================
   ELIGIBLE
========================= */

.eligible {

    margin-top: 27px;

    padding:
        16px 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    border-radius: 15px;

    background:

        linear-gradient(
            135deg,
            rgba(34, 197, 94, 0.15),
            rgba(34, 197, 94, 0.04)
        );

    border:
        1px solid
        rgba(34, 197, 94, 0.35);

    color: #31e875;

    font-size: 15px;

    font-weight: 800;
}


/* =========================
   CHECK ICON
========================= */

.check {

    width: 21px;

    height: 21px;

    flex-shrink: 0;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        #22c55e;

    color:
        #06100a;

    font-size: 13px;

    font-weight: 900;
}


/* =========================
   ALLOCATION LABEL
========================= */

.allocation-label {

    margin-top: 34px;

    color: #777f8d;

    font-size: 10px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 3px;
}


/* =========================
   ALLOCATION NUMBER
========================= */

.allocation {

    margin-top: 12px;

    font-size: 62px;

    line-height: 1;

    font-weight: 900;

    letter-spacing: -3px;

    background:

        linear-gradient(
            100deg,
            #ffffff,
            #dce6ff 50%,
            #76a0ff
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    filter:

        drop-shadow(
            0 8px 25px
            rgba(75, 120, 255, 0.18)
        );
}


/* =========================
   BASE TOKEN
========================= */

.base-token {

    margin-top: 12px;

    color: #5d8dff;

    font-size: 21px;

    font-weight: 850;

    letter-spacing: 1px;
}


/* =========================
   DIVIDER
========================= */

.divider {

    width: 100%;

    height: 1px;

    margin:
        28px 0 17px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255, 255, 255, 0.12),
            transparent
        );
}


/* =========================
   DISCLAIMER
========================= */

.disclaimer {

    color: #626b78;

    font-size: 10px;

    line-height: 1.5;
}


/* =========================
   FOOTER
========================= */

.site-footer {

    margin-top: 24px;

    text-align: center;
}


.builder {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    color: #707987;

    font-size: 13px;

    font-weight: 600;
}


.builder a {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    color: #ffffff;

    text-decoration: none;

    font-weight: 750;

    transition: 0.2s ease;
}


.builder a:hover {

    color:
        var(--base-light);

    transform:
        translateY(-1px);
}


.x-icon {

    font-size: 15px;

    line-height: 1;

    font-weight: 900;
}


/* =========================
   ANIMATION
========================= */

@keyframes resultIn {

    from {

        opacity: 0;

        transform:
            translateY(14px)
            scale(0.98);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {

        padding:
            30px 14px 25px;
    }


    .logo img {

        width: 85px;
    }


    .header h1 {

        font-size: 25px;

        letter-spacing: -1px;
    }


    .header p {

        font-size: 13px;
    }


    .search-box input {

        height: 48px;
    }


    .search-btn {

        height: 48px;

        margin-top: 20px;
    }


    .result-card {

        padding:
            30px 17px 24px;

        border-radius: 24px;
    }


    .profile-ring {

        width: 103px;

        height: 103px;
    }


    .username {

        font-size: 20px;
    }


    .eligible {

        font-size: 14px;

        padding:
            14px 9px;
    }


    .allocation {

        font-size: 49px;

        letter-spacing: -3px;
    }


    .base-token {

        font-size: 19px;
    }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 360px) {

    .header h1 {

        font-size: 22px;
    }


    .allocation {

        font-size: 42px;
    }


    .eligible {

        font-size: 13px;
    }
}
    </style>
</head>

            <h1>BASE Creators Allocation</h1>

            <p>Check your BASE allocation</p>

        </header>


        <!-- =========================
             SEARCH
        ========================== -->

        <section class="search-section">

            <div class="search-box">

                <input
                    type="text"
                    id="usernameInput"
                    placeholder="@username"
                    autocomplete="off"
                >

            </div>

            <button
                type="button"
                id="searchButton"
                class="search-btn"
            >
                Search
            </button>

            <div
                id="error"
                class="error"
            >
                Please enter a username.
            </div>

        </section>


        <!-- =========================
             RESULT CARD
        ========================== -->

        <section
            id="resultCard"
            class="result-card"
        >

            <div class="result-content">

                <div class="profile-ring">

                    <img
                        id="profileImage"
                        class="profile-img"
                        src=""
                        alt="Profile Picture"
                    >

                </div>


                <h2
                    id="username"
                    class="username"
                ></h2>


                <p
                    id="creatorName"
                    class="creator-name"
                >
                    Base Creator
                </p>


                <div class="eligible">

                    <span class="check">✓</span>

                    <span>
                        🎉 Congratulations, you're Eligible
                    </span>

                </div>


                <div class="allocation-label">
                    You have been allocated
                </div>


                <div
                    id="allocation"
                    class="allocation"
                >
                    0
                </div>


                <div class="base-token">
                    BASE
                </div>


                <div class="divider"></div>


                <p class="disclaimer">
                    Not official Base allocation.
                </p>

            </div>

        </section>


        <!-- =========================
             FOOTER
        ========================== -->

        <footer class="site-footer">

            <div class="builder">

                <a
                    href="https://x.com/samalpha_"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="x-icon">𝕏</span>
                    @samalpha_
                </a>

            </div>

        </footer>

    </main>


    <script>

        /* =========================
           GENERATE ALLOCATION
        ========================== */

        function generateAllocation(username) {

            let hash = 0;

            for (
                let i = 0;
                i < username.length;
                i++
            ) {

                hash =
                    ((hash << 5) - hash) +
                    username.charCodeAt(i);

                hash |= 0;
            }

            hash = Math.abs(hash);

            const min = 5000;
            const max = 50000;

            let allocation =
                min +
                (hash % (max - min + 1));

            /*
             * Allocation will be in
             * multiples of 500.
             */

            allocation =
                Math.round(
                    allocation / 500
                ) * 500;

            return allocation;
        }


        /* =========================
           PROFILE IMAGE
        ========================== */

        function getProfileImage(username) {

            return (
                "https://unavatar.io/x/" +
                encodeURIComponent(username)
            );
        }


        /* =========================
           FALLBACK PROFILE IMAGE
        ========================== */

        function getFallbackAvatar(username) {

            return (
                "https://ui-avatars.com/api/?" +
                "name=" +
                encodeURIComponent(username) +
                "&background=0052ff" +
                "&color=ffffff" +
                "&bold=true" +
                "&size=300"
            );
        }


        /* =========================
           SEARCH CREATOR
        ========================== */

        function searchCreator() {

            let username =
                document
                    .getElementById("usernameInput")
                    .value
                    .trim()
                    .toLowerCase();


            /*
             * Remove @ if user enters
             * @username
             */

            username =
                username.replace(/^@/, "");


            const error =
                document.getElementById("error");

            const resultCard =
                document.getElementById("resultCard");

            const profileImage =
                document.getElementById("profileImage");


            /* Empty username */

            if (!username) {

                resultCard.style.display = "none";

                error.textContent =
                    "Please enter a username.";

                error.style.display = "block";

                return;
            }


            /* Generate allocation */

            const allocation =
                generateAllocation(username);


            /* Load X profile picture */

            profileImage.src =
                getProfileImage(username);


            /*
             * If profile picture fails,
             * use fallback avatar.
             */

            profileImage.onerror =
                function () {

                    this.onerror = null;

                    this.src =
                        getFallbackAvatar(username);
                };


            /* Username */

            document
                .getElementById("username")
                .textContent =
                "@" + username;


            /* Allocation */

            document
                .getElementById("allocation")
                .textContent =
                allocation.toLocaleString();


            /* Hide error */

            error.style.display = "none";


            /* Show result */

            resultCard.style.display = "block";
        }


        /* =========================
           SEARCH BUTTON
        ========================== */

        document
            .getElementById("searchButton")
            .addEventListener(
                "click",
                searchCreator
            );


        /* =========================
           ENTER KEY
        ========================== */

        document
            .getElementById("usernameInput")
            .addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Enter") {

                        searchCreator();

                    }

                }
            );

    </script>
